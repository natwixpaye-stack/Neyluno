<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #07080d;
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    color: #f2f4f8;
    position: relative;
  }
  .glow {
    position: absolute; width: 560px; height: 560px; border-radius: 50%;
    right: -190px; top: -210px;
    background: radial-gradient(circle, rgba(255,180,84,.5), rgba(255,110,89,.18) 55%, transparent 72%);
    filter: blur(10px);
  }
  .glow2 {
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    left: -160px; bottom: -190px;
    background: radial-gradient(circle, rgba(255,110,89,.22), transparent 70%);
    filter: blur(20px);
  }
  .wrap { position: absolute; inset: 0; padding: 76px 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 34px; }
  .mark {
    width: 108px; height: 108px; border-radius: 28px;
    background: linear-gradient(135deg, #ffb454, #ff6e59);
    display: grid; place-items: center;
    box-shadow: 0 18px 60px -12px rgba(255,140,70,.45);
  }
  .mark svg { width: 56px; height: 56px; }
  .word { font-size: 96px; font-weight: 800; letter-spacing: -0.02em; }
  .tag { font-size: 52px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.16; }
  .tag .gold { background: linear-gradient(100deg, #ffb454, #ff6e59); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .foot { font-size: 26px; color: #a6adc0; font-weight: 500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6L13 2z" fill="#fff"/></svg>
      </span>
      <span class="word">Neyluno</span>
    </div>
    <div class="tag">Digital tools, made simple.<br /><span class="gold">Huge under the hood. Minimal on screen.</span></div>
    <div class="foot">43 free tools · No signup · 100% private — everything runs in your browser</div>
  </div>
</body>
</html>
